# 591 Taipei Rental Daily Report - Configuration
# Copy this file or set environment variables to override sensitive values.

# ── Search Parameters (Phase 1) ────────────────────────────────────────────
search:
  region: 1                # 1 = 台北市
  types:                   # 1 = 整層住家, 3 = 獨立套房
    - 1
    - 3
  max_rent: 38000          # 最高租金 (TWD)
  min_area: 20             # 最小坪數
  cooking_required: true   # 必須可開伙

# ── Filter Parameters (Phase 2) ────────────────────────────────────────────
filters:
  floor:
    # Floors to exclude
    exclude_floor_numbers: [0, 1]   # 0=basement, 1=1F
    exclude_keywords: ["頂樓加蓋", "頂加"]
    # Floors >= elevator_required_from require elevator tag
    elevator_required_from: 3

  furniture:
    move_in_ready_tags: ["拎包入住"]
    furnished_keywords: ["附全套家具", "全套家具", "家具齊全"]
    empty_tags: ["空屋"]

# ── MRT Proximity Filter (Phase 3) ─────────────────────────────────────────
mrt:
  enabled: true
  max_distance_meters: 800   # max walking distance to any relevant MRT station
  # Relevant MRT line sections (see mrt_data.py for full list)
  relevant_lines:
    - bannan_east            # 板南線: 忠孝新生 → 南港展覽館
    - songshan_partial       # 松山新店線: 松江南京 → 松山
    - wenhu_nanjing          # 文湖線: 南京復興 附近

# ── Google Maps Commute Filter (Phase 3 Advanced - optional) ───────────────
commute:
  enabled: false             # Set to true and provide API key to enable
  google_maps_api_key: ""    # Or use env var GOOGLE_MAPS_API_KEY
  destinations:
    wife:
      name: "南港展覽館"
      place_id: "ChIJX_TBv8aqQjQRG0HFJz9eqng"
      max_transit_minutes: 40
      max_cycling_minutes: 20
    husband:
      name: "捷運南京復興站"
      place_id: "ChIJZWxKXjaqQjQRYqJYHgniNvM"
      max_walk_to_mrt_minutes: 10
      max_bus_minutes: 30

# ── Notification Settings (Phase 4) ────────────────────────────────────────
notification:
  telegram:
    enabled: true
    bot_token: ""            # Or env var TELEGRAM_BOT_TOKEN
    chat_id: ""              # Or env var TELEGRAM_CHAT_ID

  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: ""             # Or env var EMAIL_USERNAME
    password: ""             # Or env var EMAIL_PASSWORD
    to: ""                   # Recipient address

  line_notify:
    enabled: false
    token: ""                # Or env var LINE_NOTIFY_TOKEN

# ── Scheduler ──────────────────────────────────────────────────────────────
schedule:
  daily_hour: 8
  daily_minute: 0

# ── Database ───────────────────────────────────────────────────────────────
database:
  path: "data/listings.db"

# ── Crawlers ───────────────────────────────────────────────────────────────
crawlers:
  enabled:
    - "591"
    - "ptt"
    - "dcard"
  # Stub crawlers (not yet fully implemented):
  # - "housefun"
  # - "rakuya"
  # - "sinyi"

  anti_crawl:
    min_delay_seconds: 1.5
    max_delay_seconds: 4.0
    use_random_user_agent: true
    # Set to true to use Playwright for dynamic pages (requires 'playwright install')
    use_playwright_for_591: false

# ── Deduplication (Cross-platform) ─────────────────────────────────────────
dedup:
  # Tolerance for area comparison (ping)
  area_tolerance_ping: 0.5
  # Fields used for matching: rent + area(±tolerance) + floor + district/street
  match_fields:
    - rent
    - area
    - floor
    - district
